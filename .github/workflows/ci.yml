# The gate that was missing.
#
# Until now `tsc`, the tests and the build ran only when a developer remembered
# to run them. For a system that produces GxP records, "we usually check" is not
# a control. Every push and every pull request now has to pass the same three
# commands a developer runs locally, and they are listed here in the order that
# fails fastest.
#
# A PostgreSQL service runs alongside because the API tests drive the real
# Express app over HTTP against a real database. Without DATABASE_URL those
# tests skip themselves rather than fail, so the suite still works on a machine
# with no database — but CI is where they must actually run.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vlse_test
        ports: ['5432:5432']
        # Without the healthcheck the first migration races the server starting.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vlse_test?schema=public
      JWT_SECRET: ci-only-secret-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      # The gate runs on the runtime we ship, and the version is stated once.
      #
      # Nothing here pinned Node, so `bunx tsx --test` spawned whatever Node the
      # runner happened to carry — and GitHub moved that to 24 when it deprecated
      # 20. A gate that is green "most of the time" is not a gate, and this one
      # proved it: on one commit the same tests passed under `pull_request` and
      # died under `push` with `tests/api.derivedVerdict.test.ts` taking a
      # SIGSEGV — a process crash, not a failed assertion, which is what Prisma 5
      # does on a Node it does not support.
      #
      # 22, not 20, and the whole project moved with it: `undici@8` (through
      # `jsdom@30`) requires `node >=22.19`, so the render tests cannot start on
      # 20 at all, and Node 20 left support in April 2026. Keep this in step with
      # `engines` in package.json and the `FROM node:22-alpine` lines in the
      # Dockerfile — the three have to name the same runtime or this gate is
      # measuring something nobody runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repository locks twice on purpose: `bun.lock` is what a developer
      # installs from and what CI resolves here, and `package-lock.json` is what
      # the production image installs from with `npm ci`. Both are committed and
      # both must be updated when a dependency moves, or one of the two installs
      # starts failing on a mismatch.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `postinstall` already runs this, but it is cheap and the build depends
      # on the generated client existing.
      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Apply migrations to the test database
        run: bunx prisma migrate deploy

      - name: Typecheck
        run: bunx tsc --noEmit

      # ESLint is a gate for defects, not for style: hook-order violations,
      # unreachable branches, duplicated keys. Warnings do not fail the build —
      # a gate everyone learns to ignore stops being a gate — so `--max-warnings`
      # is deliberately not set.
      - name: Lint
        run: bunx eslint .

      # Unit tests and API tests in one run. Serially, because the API files
      # each reset the database: run in parallel they truncate the tables the
      # other one is using and fail for reasons that have nothing to do with the
      # code. The whole suite takes about twenty seconds.
      - name: Tests
        run: bunx tsx --test --test-concurrency=1 tests/*.test.ts

      # The render tests mount the real React tree in jsdom, which node's own
      # test runner cannot do: `App.tsx` imports a PNG and the components import
      # CSS. Vitest is the Vite pipeline itself, so the same config that builds
      # the application builds the test. They need no database.
      - name: Render tests
        run: bunx vitest run --config vitest.config.ts

      # Frontend only: the full `npm run build` also runs the migration script,
      # which has already run against the service container above.
      - name: Build frontend
        run: bunx vite build

      # The server is bundled separately in the real build; compiling it here
      # catches a server-side break that `vite build` alone would miss.
      - name: Bundle server
        run: >
          bunx esbuild server.ts --bundle --platform=node --format=cjs
          --packages=external --outfile=/tmp/server.cjs

  # The image the IT department actually installs.
  #
  # `deploy/install.sh` ends in `docker compose build`, and nothing ever built
  # that image before a customer did. It went unnoticed while the base image sat
  # still; it stopped being ignorable the moment the runtime moved from
  # `node:20-alpine` to 22, because a base image that fails to build fails on the
  # customer's server, during an installation, with no way back.
  #
  # Build only — nothing is pushed anywhere. `npm ci` inside the image also keeps
  # `package-lock.json` honest: the lockfile the production install reads is not
  # the one the rest of this workflow uses (that is `bun.lock`), so this is the
  # only place a mismatch between the two would surface.
  image:
    name: deployment image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build the deployment image
        run: docker build -t vlse:ci .
